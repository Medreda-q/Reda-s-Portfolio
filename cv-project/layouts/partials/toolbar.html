<style>
  .download-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    box-sizing: border-box;
  }
  .download-modal-content {
    background: var(--bodyBgColor);
    color: var(--bodyTextColor);
    border: 1px solid var(--accentColor);
    border-radius: 12px;
    padding: 1.8rem;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    box-sizing: border-box;
    text-align: left;
    animation: modalSlideIn 0.22s ease-out;
  }
  @keyframes modalSlideIn {
    from { opacity: 0; transform: translateY(-12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .download-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }
  .download-modal-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accentColor);
    display: flex;
    align-items: center;
    gap: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .download-modal-close {
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--bodyTextColor);
    cursor: pointer;
    opacity: 0.7;
    padding: 0.3rem 0.5rem;
    line-height: 1;
    border-radius: 4px;
    transition: opacity 0.2s, background-color 0.2s;
  }
  .download-modal-close:hover {
    opacity: 1;
    background: rgba(128,128,128,0.15);
  }
  .download-modal-subtitle {
    margin: 0 0 1.25rem 0;
    font-size: 0.9rem;
    opacity: 0.75;
  }
  .download-modal-field {
    margin-bottom: 1.15rem;
  }
  .download-modal-label {
    display: block;
    font-size: 0.76rem;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.6px;
    opacity: 0.7;
    margin-bottom: 0.45rem;
  }
  .download-modal-options {
    display: flex;
    gap: 0.55rem;
  }
  .modal-opt-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    padding: 0.65rem 0.5rem;
    border: 1.5px solid var(--accentColor);
    border-radius: 7px;
    background: transparent;
    color: var(--bodyTextColor);
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.18s ease;
    min-height: 44px;
    box-sizing: border-box;
    font-family: inherit;
  }
  .modal-opt-btn:hover {
    background: rgba(128, 128, 128, 0.12);
  }
  .modal-opt-btn.active {
    background: var(--accentColor) !important;
    color: var(--bodyBgColor) !important;
    border-color: var(--accentColor) !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .modal-opt-btn.active i {
    color: var(--bodyBgColor) !important;
  }
  .download-modal-actions {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    margin-top: 1.4rem;
  }
  .modal-btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    padding: 0.8rem 1rem;
    background: var(--accentColor);
    color: var(--bodyBgColor) !important;
    border-radius: 7px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.18s, transform 0.12s;
    min-height: 46px;
    box-sizing: border-box;
  }
  .modal-btn-primary:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }
  .modal-btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    padding: 0.65rem 1rem;
    background: transparent;
    color: var(--accentColor) !important;
    border: 1.5px solid var(--accentColor);
    border-radius: 7px;
    font-weight: 600;
    font-size: 0.88rem;
    text-decoration: none;
    cursor: pointer;
    min-height: 42px;
    box-sizing: border-box;
    transition: background-color 0.18s;
  }
  .modal-btn-secondary:hover {
    background: rgba(128, 128, 128, 0.1);
  }

  @media only screen and (max-width: 649px) {
    .toolbar {
      font-size: 1rem !important;
      margin: 0.5rem auto !important;
      padding: 0 0.5rem;
    }
    .toolbar button, .toolbar a {
      margin: 0.4rem 0.25rem !important;
    }
    .toolbar-item-text {
      display: none;
    }
    .download-modal-content {
      padding: 1.3rem;
    }
    .modal-opt-btn {
      font-size: 0.8rem;
      padding: 0.5rem 0.3rem;
    }
  }
</style>

<script>
  function toggleDarkMode() {
    const classes = document.querySelector("html").classList;
    if (classes.contains("dark")) {
      classes.remove("dark");
      try {
        localStorage.setItem("theme", "light");
      } catch (e) {}
    } else {
      classes.add("dark");
      try {
        localStorage.setItem("theme", "dark");
      } catch (e) {}
    }
  }

  function toggleLanguageDropdown() {
    document.getElementById("lang-dropdown").classList.toggle("show");
  }

  window.onclick = function(event) {
    if (!event.target.matches('.lang-dropbtn') && !event.target.closest('.lang-dropbtn')) {
      var dropdowns = document.getElementsByClassName("lang-dropdown-content");
      for (var i = 0; i < dropdowns.length; i++) {
        var openDropdown = dropdowns[i];
        if (openDropdown.classList.contains('show')) {
          openDropdown.classList.remove('show');
        }
      }
    }
    const modal = document.getElementById("download-modal");
    if (modal && event.target === modal) {
      closeDownloadModal();
    }
  };

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      closeDownloadModal();
    }
  });

  let savedTheme = null;
  try {
    savedTheme = localStorage.getItem("theme");
  } catch (e) {
    console.warn("localStorage is unavailable or restricted in this environment:", e);
  }
  const htmlClasses = document.querySelector("html").classList;

  if (savedTheme === "dark") {
    htmlClasses.add("dark");
  } else if (savedTheme === "light") {
    htmlClasses.remove("dark");
  } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    htmlClasses.add("dark");
  }

  try {
    var savedLang = localStorage.getItem("lang");
    var currentPath = window.location.pathname.replace(/\/+$/, "") || "/";
    var pathLang = "en";
    if (currentPath.startsWith("/fr")) pathLang = "fr";
    else if (currentPath.startsWith("/es")) pathLang = "es";

    if (currentPath === "/") {
      if (savedLang && savedLang !== "en") {
        window.location.replace("/" + savedLang + "/");
      }
    } else {
      localStorage.setItem("lang", pathLang);
    }
  } catch(e) {}
</script>

<!-- Download Modal -->
<div id="download-modal" class="download-modal-overlay">
  <div class="download-modal-content" role="dialog" aria-modal="true" aria-labelledby="download-modal-title-text">
    <div class="download-modal-header">
      <div class="download-modal-title" id="download-modal-title-text">
        <i class="fa-solid fa-file-arrow-down"></i>
        <span>Download CV</span>
      </div>
      <button class="download-modal-close" onclick="closeDownloadModal()" aria-label="Close modal">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    
    <p class="download-modal-subtitle">Choose language &amp; file format</p>

    <!-- Language Selection -->
    <div class="download-modal-field">
      <label class="download-modal-label">Language</label>
      <div class="download-modal-options">
        <button type="button" onclick="setModalLang('en')" id="modal-lang-en" class="modal-opt-btn">
          <span>🇬🇧</span>
          <span>English</span>
        </button>
        <button type="button" onclick="setModalLang('fr')" id="modal-lang-fr" class="modal-opt-btn">
          <span>🇫🇷</span>
          <span>Français</span>
        </button>
        <button type="button" onclick="setModalLang('es')" id="modal-lang-es" class="modal-opt-btn">
          <span>🇪🇸</span>
          <span>Español</span>
        </button>
      </div>
    </div>

    <!-- Format Selection -->
    <div class="download-modal-field">
      <label class="download-modal-label">Format</label>
      <div class="download-modal-options">
        <button type="button" onclick="setModalFormat('pdf')" id="modal-format-pdf" class="modal-opt-btn">
          <i class="fa-solid fa-file-pdf" style="color: #e74c3c;"></i>
          <span>PDF (Recommended)</span>
        </button>
        <button type="button" onclick="setModalFormat('docx')" id="modal-format-docx" class="modal-opt-btn">
          <i class="fa-solid fa-file-word" style="color: #2980b9;"></i>
          <span>Word (.docx)</span>
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="download-modal-actions">
      <a id="modal-download-btn" href="#" download class="modal-btn-primary">
        <i class="fa-solid fa-download"></i>
        <span id="modal-download-text">Download CV</span>
      </a>
      <a id="modal-preview-btn" href="#" target="_blank" rel="noopener noreferrer" class="modal-btn-secondary">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        <span>Preview in Browser</span>
      </a>
    </div>
  </div>
</div>

<div class="toolbar">
  <a href="/" class="toolbar-brand" target="_self">
    <i class="fa-solid fa-house-chimney"></i>
    <span class="toolbar-item-text">{{ i18n "toolbar.portfolio" }}</span>
  </a>

  <div class="toolbar-spacer" style="flex-grow: 1;"></div>

  <div class="toolbar-actions">
    <button class="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle theme">
      <span class="hide-dark">
        <i class="fa-solid fa-sun"></i>
      </span>
      <span class="hide-light">
        <i class="fa-solid fa-moon"></i>
      </span>
      <span class="toolbar-item-text">{{ i18n "toolbar.toggle-theme" }}</span>
    </button>

    <span class="toolbar-separator">|</span>

    <div class="lang-dropdown-container">
      <button onclick="toggleLanguageDropdown()" class="lang-dropbtn" aria-label="Switch language">
        <i class="fa-solid fa-language"></i> <span class="toolbar-item-text">{{ i18n "toolbar.language" }}</span>
      </button>
      <div id="lang-dropdown" class="lang-dropdown-content">
        {{ range $.Site.Home.AllTranslations }}
          {{ if ne $.Site.Language.Lang .Language.Lang }}
            <a href="{{ .Permalink }}" target="_self">
              {{ .Language.Label }}
            </a>
          {{ end }}
        {{ end }}
      </div>
    </div>

    <span class="toolbar-separator">|</span>

    <button class="download-button" id="cv-download-btn" onclick="openDownloadModal()" aria-label="Download CV">
      <i class="fa-solid fa-file-arrow-down"></i> <span class="toolbar-item-text">{{ i18n "toolbar.download" | default "Download CV" }}</span>
    </button>
  </div>
</div>

<script>
  const cvCurrentLang = "{{ .Site.Language.Lang }}";
  let modalLang = ["en", "fr", "es"].includes(cvCurrentLang) ? cvCurrentLang : "en";
  let modalFormat = "pdf";

  const cvBasePath = "{{ "assets/cv/" | relURL }}";

  const cvFiles = {
    en: {
      pdf: cvBasePath + "CV_MohamedReda_Qiyaoui_en.pdf",
      docx: cvBasePath + "CV_MohamedReda_Qiyaoui_en.docx",
      label: "English"
    },
    fr: {
      pdf: cvBasePath + "CV_MohamedReda_Qiyaoui_fr.pdf",
      docx: cvBasePath + "CV_MohamedReda_Qiyaoui_fr.docx",
      label: "Français"
    },
    es: {
      pdf: cvBasePath + "CV_MohamedReda_Qiyaoui_es.pdf",
      docx: cvBasePath + "CV_MohamedReda_Qiyaoui_es.docx",
      label: "Español"
    }
  };

  function updateDownloadModal() {
    const fileInfo = cvFiles[modalLang] || cvFiles.en;
    const filePath = fileInfo[modalFormat];
    const fileName = filePath.substring(filePath.lastIndexOf("/") + 1);

    const downloadBtn = document.getElementById("modal-download-btn");
    const previewBtn = document.getElementById("modal-preview-btn");
    const downloadText = document.getElementById("modal-download-text");

    if (downloadBtn) {
      downloadBtn.href = filePath;
      downloadBtn.setAttribute("download", fileName);
    }

    if (previewBtn) {
      previewBtn.href = filePath;
      // Word documents cannot be natively previewed in browser tab
      if (modalFormat === "docx") {
        previewBtn.style.display = "none";
      } else {
        previewBtn.style.display = "inline-flex";
      }
    }

    if (downloadText) {
      downloadText.textContent = `Download CV (${modalLang.toUpperCase()} · ${modalFormat.toUpperCase()})`;
    }

    ["en", "fr", "es"].forEach(l => {
      const el = document.getElementById(`modal-lang-${l}`);
      if (el) {
        if (l === modalLang) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      }
    });

    ["pdf", "docx"].forEach(f => {
      const el = document.getElementById(`modal-format-${f}`);
      if (el) {
        if (f === modalFormat) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      }
    });
  }

  function setModalLang(lang) {
    modalLang = lang;
    updateDownloadModal();
  }

  function setModalFormat(format) {
    modalFormat = format;
    updateDownloadModal();
  }

  function openDownloadModal() {
    modalLang = ["en", "fr", "es"].includes(cvCurrentLang) ? cvCurrentLang : "en";
    modalFormat = "pdf";
    updateDownloadModal();
    const modal = document.getElementById("download-modal");
    if (modal) {
      modal.style.display = "flex";
    }
  }

  function closeDownloadModal() {
    const modal = document.getElementById("download-modal");
    if (modal) {
      modal.style.display = "none";
    }
  }

  document.querySelectorAll(".lang-dropdown-content a").forEach(function(link) {
    link.addEventListener("click", function() {
      try {
        var href = this.getAttribute("href");
        var langMatch = href.match(/\/(en|fr|es)\/?/);
        var lang = langMatch ? langMatch[1] : "en";
        localStorage.setItem("lang", lang);
      } catch(e) {}
    });
  });
</script>
