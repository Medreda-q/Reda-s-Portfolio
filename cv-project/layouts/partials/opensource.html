<div class="cv-opensource mobile-hide">
  <h2 class="cv-sidebar-heading">
    {{ i18n "section-header.open-source" }}
  </h2>
  {{ with .title }}<p>{{ . }}</p>{{ end }}
  <ul>
    {{ range .contributions }}
      <li class="cv-opensource-contribution">
        {{ if .link }}
          <a href="{{ .link }}" target="_blank" rel="noopener noreferrer">
            {{ .name }}
            <i class="fa-solid fa-link"></i>
          </a>
          ({{ .description }})
        {{ else }}
          {{ .name }}
        {{ end }}
      </li>
    {{ end }}
  </ul>
</div>
