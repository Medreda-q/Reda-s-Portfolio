<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CV of Mohamed Reda Qiyaoui — Cybersecurity, Information Systems Audit student and web developer at EST Tétouan." />
  <meta property="og:title" content="CV | Mohamed Reda Qiyaoui" />
  <meta property="og:description" content="CV of Mohamed Reda Qiyaoui — Cybersecurity, Information Systems Audit student and web developer at EST Tétouan." />
  <meta property="og:image" content="https://mohamedreda.is-a.dev/assets/og-image.png" />
  <meta property="og:url" content="https://mohamedreda.is-a.dev/CV" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://mohamedreda.is-a.dev/CV" />
  <meta http-equiv="refresh" content="0; url=https://reda-s-cv.vercel.app/" />
  <title>CV | Mohamed Reda Qiyaoui — Cybersecurity &amp; Web Developer</title>
  <link rel="icon" href="/assets/profile.jpg" type="image/jpeg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: #1b1b1b;
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    .cv-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .cv-loader__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: #037daf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .cv-loader__text {
      font-size: .85rem;
      color: rgba(229,229,229,.5);
      letter-spacing: .04em;
    }

    .cv-loader__link {
      font-size: .8rem;
      color: #037daf;
      text-decoration: underline;
      margin-top: 4px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="cv-loader">
    <div class="cv-loader__spinner"></div>
    <span class="cv-loader__text">Redirecting to CV…</span>
    <a class="cv-loader__link" href="https://reda-s-cv.vercel.app/">Click here if not redirected</a>
  </div>
  <script>
    window.location.replace("https://reda-s-cv.vercel.app/");
  </script>
</body>
</html>
