<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="HandheldFriendly" content="True" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Curriculum Vitae of Mohamed Reda Qiyaoui – Cybersecurity student and pentesting enthusiast." />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500|Nunito&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <link rel="icon" href="/assets/profile.jpg" type="image/jpeg" />
    <title>CV | Mohamed Reda Qiyaoui</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        overflow: hidden;
        background: #1b1b1b;
        color: #e5e5e5;
        font-family: "Roboto", "Helvetica", "Arial", sans-serif;
      }

      /* ── Top bar ── */
      .cv-topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 1100;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: #1b1b1b;
        box-shadow: 0 2px 8px rgba(0,0,0,.5);
        gap: 1rem;
      }

      .cv-topbar__back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #e5e5e5;
        text-decoration: none;
        font-size: .85rem;
        font-weight: 500;
        letter-spacing: .04em;
        text-transform: uppercase;
        padding: 6px 10px;
        border-radius: 4px;
        transition: background 200ms ease;
      }
      .cv-topbar__back:hover { background: rgba(255,255,255,.08); }
      .cv-topbar__back svg { flex-shrink: 0; }

      .cv-topbar__title {
        font-size: .9rem;
        font-weight: 400;
        color: rgba(229,229,229,.7);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cv-topbar__actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .cv-topbar__btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 4px;
        font-size: .8rem;
        font-weight: 500;
        letter-spacing: .04em;
        text-transform: uppercase;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 200ms ease, color 200ms ease;
      }
      .cv-topbar__btn--outline {
        background: transparent;
        color: #e5e5e5;
        border: 1px solid rgba(255,255,255,.25);
      }
      .cv-topbar__btn--outline:hover { background: rgba(255,255,255,.1); }

      /* ── iframe wrapper ── */
      .cv-frame-wrap {
        position: fixed;
        inset: 0;
        top: 52px;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .cv-frame-wrap.loaded { opacity: 1; }

      #cv-iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* ── Loading overlay ── */
      .cv-loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1b1b1b;
        transition: opacity 300ms ease;
      }
      .cv-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .cv-loader__spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,.1);
        border-top-color: #037daf;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .cv-loader__text {
        font-size: .85rem;
        color: rgba(229,229,229,.5);
        letter-spacing: .04em;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <!-- Top Bar -->
    <header class="cv-topbar">
      <a class="cv-topbar__back" href="/" aria-label="Back to portfolio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Portfolio
      </a>

      <span class="cv-topbar__title">Mohamed Reda Qiyaoui — CV</span>

      <div class="cv-topbar__actions">
        <a class="cv-topbar__btn cv-topbar__btn--outline"
           href="https://reda-s-cv.vercel.app/"
           target="_blank"
           rel="noopener"
           aria-label="Open CV in new tab">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          Open
        </a>
      </div>
    </header>

    <!-- CV iframe -->
    <div class="cv-frame-wrap" id="cv-frame-wrap">
      <div class="cv-loader" id="cv-loader">
        <div class="cv-loader__spinner"></div>
        <span class="cv-loader__text">Loading CV…</span>
      </div>
      <iframe
        id="cv-iframe"
        src="https://reda-s-cv.vercel.app/"
        title="Mohamed Reda Qiyaoui – CV"
        loading="eager"
        allowfullscreen
      ></iframe>
    </div>

    <script>
      const iframe = document.getElementById('cv-iframe');
      const wrap   = document.getElementById('cv-frame-wrap');
      const loader = document.getElementById('cv-loader');

      iframe.addEventListener('load', () => {
        loader.classList.add('hidden');
        wrap.classList.add('loaded');
      });
    </script>
  </body>
</html>
